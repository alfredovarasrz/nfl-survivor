name: Offline tests
on: [push, pull_request]
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python -m pip install -r requirements.lock
      - run: python -m pytest -q
      - run: python examples/demo.py
      - run: python survivor.py replay .demo-output/outputs/2030/week_01/synthetic_small_small_pool.json
      - run: python examples/global_demo.py
      - run: python survivor.py replay .demo-output/global/outputs/2030/week_01/synthetic_global_certified_large_pool.json
